limitations:
  - 使用APTOS 2019公开训练集的本地处理副本，不是Kaggle隐藏测试集。
  - 原3662条记录中有完全重复和标签冲突；排除62条exact-conflict及15条高置信近重复冲突记录，合并96条exact和4条高置信近重复副本，保留3485张唯一图像。
  - 去重后按seed 2026进行确定性图像级分层85/15划分，五个稳健性种子均在测试前固定。
  - 数据不提供patient_id，患者级泄漏无法完全评估，患者级泛化尚未建立。
  - 特征标准化与探针参数仅在Development五折内部拟合和选择，冻结Test仅作最终评估。
