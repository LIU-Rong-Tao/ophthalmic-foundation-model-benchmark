release_id: '2026.07'
title: OphBench private CFP frozen-feature benchmark
release_date: '2026-07-30'
status: internal
default_task_id: private-fundus-59class
task_ids:
  - private-fundus-59class
  - private-fundus-dr-stage-3class
  - aptos2019-dr-5class
tasks:
  - task_id: private-fundus-59class
    display_name: 59类眼底疾病
    task_type: single_label_multiclass_classification
    class_count: 59
    sample_count: 9853
  - task_id: private-fundus-dr-stage-3class
    display_name: 探索性DR目录三分类（Normal / NPDR / PDR）
    task_type: single_label_multiclass_classification
    class_count: 3
    sample_count: 673
    label_semantics: observed_directory_subclass
    evidence_status: diagnostic_only
    shortcut_risk: high
    limitations:
      - 标签来自canonical数据中的Normal及DR/NPDR、DR/PDR目录，不是正式病例标注表。
      - 不具备ICDR五级标签；缺少patient_id，患者级泛化未建立。
      - Normal与NPDR/PDR的文件格式和分辨率分布明显不同；元数据基线Macro-F1为0.789，存在高采集捷径风险。
      - 当前结果仅用于数据诊断，不作为正式模型能力排名。
  - task_id: aptos2019-dr-5class
    display_name: APTOS 2019 DR 五级分级（去重）
    task_type: ordinal_classification
    class_count: 5
    sample_count: 3485
    label_semantics: public_aptos2019_icdr_grade
    evidence_status: public_dataset_decontaminated_holdout
    primary_metric: Quadratic Weighted Kappa
    limitations:
      - 使用APTOS 2019公开训练集的本地处理副本，不是Kaggle隐藏测试集。
      - 排除77条标签冲突重复记录并合并100条同标签副本，保留3485张唯一图像，再按seed 2026固定分层85/15划分。
      - 数据不提供patient_id，患者级泄漏无法完全评估。
protocol_ids:
  - frozen-feature-single-observed-v1
  - precomputed-frozen-feature-logreg-v1
notes: This release contains sanitized aggregate metrics only.
limitations:
  - Dashboard results are exploratory frozen-feature comparisons.
  - Patient identifiers are unavailable; patient-level generalization is not established.
