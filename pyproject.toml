[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophthalmic-foundation-model-benchmark"
version = "0.1.0"
description = "Registry infrastructure for ophthalmic foundation models"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "PyYAML>=6", "openpyxl>=3.1", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ophbench = "ophbench.cli:app"

[tool.setuptools.packages.find]
include = ["ophbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
