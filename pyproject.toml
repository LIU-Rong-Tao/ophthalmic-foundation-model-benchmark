[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophthalmic-foundation-model-benchmark"
version = "0.2.0"
description = "Registry infrastructure for ophthalmic foundation models"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "PyYAML>=6", "openpyxl>=3.1", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "ruff>=0.5"]
retfound = ["torch>=2.0", "torchvision>=0.15", "timm>=0.9", "Pillow>=9"]

[project.scripts]
ophbench = "ophbench.cli:app"

[tool.setuptools.packages.find]
include = ["ophbench*"]
namespaces = false

[tool.setuptools.package-data]
"ophbench._registry_data.models" = ["*.yaml"]
"ophbench._registry_data.checkpoints" = ["*.yaml"]
"ophbench._registry_data.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
