<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OphBench scalable directions</title>
  <style>
    :root{--ink:#152238;--muted:#667085;--line:#dce3ec;--bg:#f7f9fc;--panel:#fff;--blue:#2855d9;--cyan:#0b8f9c;--orange:#d97706;--green:#138a5b}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"Segoe UI","Noto Sans SC",sans-serif}
    button,select,input{font:inherit}.app{min-height:100vh}.top{height:58px;background:#101828;color:#fff;display:flex;align-items:center;padding:0 34px;gap:30px}
    .mark{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:.2px}.logo{width:27px;height:27px;border-radius:7px;background:#fff;color:#101828;display:grid;place-items:center;font-size:11px}
    .nav{display:flex;gap:24px;color:#b9c2d0;font-size:13px}.nav b{color:#fff}.release{margin-left:auto;border:1px solid #344054;border-radius:7px;padding:7px 11px;color:#d0d5dd}
    main{max-width:1480px;margin:auto;padding:25px 34px 52px}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--blue);font-weight:800;text-transform:uppercase}
    h1{font-size:27px;margin:7px 0 4px;letter-spacing:-.025em}.sub{color:var(--muted);font-size:13px}.toolbar{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;gap:9px;align-items:center}
    .pill{padding:7px 11px;border:1px solid var(--line);background:#fff;border-radius:7px;color:#475467}.pill.active{background:#edf2ff;border-color:#bfcafa;color:#2446a8;font-weight:700}
    .search{margin-left:auto;width:230px;padding:8px 11px;border:1px solid var(--line);border-radius:7px;color:#98a2b3}.meta{display:flex;gap:20px;margin:14px 0;color:#667085;font-size:12px}.meta b{color:#101828}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}.panel-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.panel-head h2{font-size:15px;margin:0}.note{color:var(--muted);font-size:12px}.grow{flex:1}
    table{width:100%;border-collapse:collapse}th{background:#f8fafc;color:#667085;text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line)}th:nth-child(1),th:nth-child(2){text-align:left}td{padding:12px;border-bottom:1px solid #edf0f4;text-align:right;font-variant-numeric:tabular-nums}td:nth-child(1),td:nth-child(2){text-align:left}.rank{color:#98a2b3;width:36px}.model{font-weight:700}.tag{font-size:10px;padding:3px 6px;border-radius:99px;background:#eef2f6;color:#475467;margin-left:6px}.best{color:var(--green);font-weight:750}.delta{font-size:10px;color:#12a06a}.bar{height:4px;background:#e8edf5;border-radius:99px;margin-top:4px}.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}.mini{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px}.mini h3{font-size:14px;margin:0 0 5px}.heat{display:grid;grid-template-columns:150px repeat(7,1fr);gap:3px;margin-top:12px;align-items:center}.heat span{height:27px;display:grid;place-items:center;border-radius:4px;font-size:10px}.heat .lab{justify-content:start;color:#475467}.h1{background:#dbeafe}.h2{background:#a5d8ef}.h3{background:#76c5c8}.h4{background:#42a896;color:#fff}.h5{background:#167d72;color:#fff}
    .dotrow{display:grid;grid-template-columns:140px 1fr 55px;align-items:center;gap:10px;margin:12px 0}.track{height:2px;background:#d9e0ea;position:relative}.track i{position:absolute;left:35%;right:20%;top:-3px;height:8px;background:#9bb5ea;border-radius:9px}.track b{position:absolute;left:58%;top:-5px;width:11px;height:11px;background:#2855d9;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #2855d9}.mode-b .top{background:#fff;color:#172033;border-bottom:1px solid var(--line)}.mode-b .logo{background:#2354d8;color:#fff}.mode-b .nav{color:#667085}.mode-b .nav b{color:#2354d8}.mode-b .release{border-color:var(--line);color:#475467}
    .mode-b .matrix-wrap{display:grid;grid-template-columns:260px 1fr;gap:14px;margin-top:18px}.filters{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px}.filters h3{font-size:13px;margin:0 0 12px}.filters label{display:block;color:#667085;font-size:11px;margin:13px 0 5px}.filters select,.filters input{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff}.switch{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef1f5;color:#475467}.matrix{display:grid;grid-template-columns:190px repeat(7,minmax(80px,1fr));min-width:900px}.matrix div{padding:11px 9px;border-right:1px solid #edf0f4;border-bottom:1px solid #edf0f4;text-align:center}.matrix .mh{background:#f8fafc;color:#667085;font-size:10px;font-weight:700}.matrix .ml{text-align:left;background:#fff;font-weight:650;position:sticky;left:0}.score{font-weight:700}.s1{background:#f2f6ff}.s2{background:#dfebff}.s3{background:#c7dcff}.s4{background:#9cc2fa}.s5{background:#69a3ed;color:#09204d}.mode-c{--bg:#f4f2ed;--panel:#fffefa;--line:#d9d5cb;--ink:#22211f;--muted:#6b6862;--blue:#ba4b2b}.mode-c .top{background:#f4f2ed;color:#22211f;border-bottom:1px solid #d9d5cb}.mode-c .logo{background:#ba4b2b;color:#fff;border-radius:50%}.mode-c .nav{color:#6b6862}.mode-c .nav b{color:#ba4b2b}.mode-c .release{border-color:#cfc9bd;color:#5c5953}.mode-c main{max-width:1320px}.mode-c h1{font-family:Georgia,"Noto Serif SC",serif;font-size:31px}.mode-c .panel{border-radius:3px}.mode-c .toolbar{border-radius:3px}.ranklist{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.rankcard{background:#fffefa;border:1px solid var(--line);padding:15px}.rankcard h3{margin:0 0 14px;font-size:13px}.rline{display:grid;grid-template-columns:95px 1fr 45px;gap:8px;align-items:center;margin:11px 0}.spark{height:20px;position:relative}.spark:before{content:"";position:absolute;left:0;right:0;top:10px;border-top:1px solid #ccc}.spark i{position:absolute;top:4px;width:12px;height:12px;border-radius:50%;background:#ba4b2b}.insight-table{margin-top:14px;display:grid;grid-template-columns:180px repeat(5,1fr);border:1px solid var(--line);background:#fffefa}.insight-table div{padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.insight-table .ih{font-size:10px;text-transform:uppercase;color:#77736c;background:#f0ede6}.insight-table .il{font-weight:650}.up{color:#16825d}.down{color:#b54736}
    @media(max-width:900px){.grid,.mode-b .matrix-wrap,.ranklist{grid-template-columns:1fr}.filters{display:none}.top{padding:0 16px}.nav{display:none}main{padding:20px 16px}.search{display:none}.panel{overflow:auto}}
  </style>
</head>
<body><div id="root"></div>
<script>
const models=["RETFound-Green","RETFound CFP","EyeCLIP","MIRAGE-Large","UrFound","FLAIR","KeepFIT","RET-CLIP","PRETI","FMUE","MIRAGE-Base","RETZero","DERETFound"];
const verified=[
  {name:"RETFound-Green",f1:.474,bacc:.465,acc:.598,top3:.832,auroc:.965},
  {name:"RETFound CFP",f1:.388,bacc:.403,acc:.481,top3:.709,auroc:.913},
  {name:"EyeCLIP",f1:.260,bacc:.270,acc:.364,top3:.581,auroc:.866}
];
const classF1=[
  {name:"RETFound-Green",v:[.697,.508,.759,.264,.430,.790,.689]},
  {name:"RETFound CFP",v:[.659,.413,.673,.231,.352,.741,.767]},
  {name:"EyeCLIP",v:[.516,.343,.589,.204,.217,.565,.540]}
];
const mode=new URLSearchParams(location.search).get("mode")||"a";
function shell(body,cls=""){return `<div class="app mode-${cls||mode}"><header class="top"><div class="mark"><span class="logo">OB</span>OphBench</div><nav class="nav"><b>Leaderboard</b><span>Tasks</span><span>Models</span><span>Insights</span><span>Methodology</span></nav><span class="release">Release 2026.07 ▾</span></header>${body}</div>`}
function rows(){return models.map((m,i)=>{const r=verified[i];return `<tr><td class="rank">${i+1}</td><td><span class="model">${m}</span>${r?'<span class="tag">verified</span>':'<span class="tag">待接入</span>'}</td><td class="${i===0?'best':''}">${r?r.f1.toFixed(3):'—'} ${i===0?'<span class="delta">▲</span>':''}${r?`<div class="bar"><i style="width:${r.f1*170}%"></i></div>`:''}</td><td>${r?r.bacc.toFixed(3):'—'}</td><td>${r?r.acc.toFixed(3):'—'}</td><td>${r?r.top3.toFixed(3):'—'}</td><td>${r?r.auroc.toFixed(3):'—'}</td><td>›</td></tr>`}).join("")}
function head(label){return `<main><div class="eyebrow">${label}</div><h1>Fundus Foundation Model Benchmark</h1><div class="sub">统一冻结特征协议下的迁移能力比较 · 所有缺失指标保持为空</div>`}
function A(){let heat=classF1.map((r)=>`<span class="lab">${r.name}</span>${r.v.map((x)=>`<span class="h${Math.max(1,Math.ceil(x*5))}">${x.toFixed(3)}</span>`).join("")}`).join("");return shell(head("Direction A · Dense leaderboard")+
`<div class="toolbar"><button class="pill active">59类疾病</button><button class="pill">新增任务需验收</button><button class="pill">本地资产模型 13</button><button class="pill">已有真实结果 3</button><input class="search" value="搜索模型、checkpoint…"></div><div class="meta"><span><b>3</b> benchmarked models</span><span><b>59</b> classes</span><span>primary metric <b>Macro-F1</b></span><span>patient-level status <b>unverified</b></span></div>
<section class="panel"><div class="panel-head"><h2>Leaderboard</h2><span class="note">按 Macro-F1 排序 · 点击模型行展开证据与逐类指标</span><span class="grow"></span><button class="pill">Columns</button><button class="pill">Export</button></div><table><thead><tr><th>#</th><th>Model</th><th>Macro-F1</th><th>BAcc</th><th>Accuracy</th><th>Top-3</th><th>AUROC</th><th></th></tr></thead><tbody>${rows()}</tbody></table></section>
<div class="grid"><section class="mini"><h3>逐类能力矩阵</h3><div class="note">示例列均取自现有 59 类真实逐类 F1；扩展模型时纵向增加</div><div class="heat"><span></span>${["AH","AMD","DR","Glaucoma","ME","RVO","VKH"].map(x=>`<span>${x}</span>`).join("")}${heat}</div></section><section class="mini"><h3>五种子稳定性</h3><div class="note">点为真实均值，区间按已记录标准差展示，不再使用成组柱状图</div>${[["RETFound-Green",.473,.006],["RETFound CFP",.382,.009],["EyeCLIP",.256,.009]].map((r,i)=>`<div class="dotrow"><span>${r[0]}</span><div class="track"><i style="left:${32-i*8}%;right:${52+i*8}%"></i><b style="left:${39-i*8}%"></b></div><strong>${r[1].toFixed(3)}</strong></div>`).join("")}</section></div></main>`,"a")}
function B(){let cells=models.map((m,i)=>{const r=classF1[i];return `<div class="ml">${i+1}. ${m}</div>${[0,1,2,3,4,5,6].map((j)=>r?`<div class="score s${Math.max(1,Math.ceil(r.v[j]*5))}">${r.v[j].toFixed(3)}</div>`:`<div>—</div>`).join("")}`}).join("");return shell(head("Direction B · Capability matrix")+
`<div class="matrix-wrap"><aside class="filters"><h3>Compare settings</h3><label>Task</label><select><option>59类眼底疾病</option></select><label>Metric</label><select><option>Macro-F1</option></select><label>Model search</label><input value="全部模型"><label>Evidence</label><div class="switch"><span>Local asset models</span><b>13</b></div><div class="switch"><span>GPU smoke passed</span><b>3</b></div><div class="switch"><span>Pending adapter audit</span><b>10</b></div><label>Support threshold</label><select><option>support ≥ 5</option></select></aside>
<section class="panel"><div class="panel-head"><h2>Model × class matrix</h2><span class="note">横向浏览 59 个疾病类别，纵向扩展模型；当前展示真实逐类 F1 子集</span><span class="grow"></span><button class="pill">Rank view</button></div><div class="matrix"><div class="mh">Model</div>${["AH","AMD","DR","Glaucoma","ME","RVO","VKH"].map(x=>`<div class="mh">${x}</div>`).join("")}${cells}</div></section></div></main>`,"b")}
function C(){return shell(head("Direction C · Rank & evidence journal")+
`<div class="toolbar"><button class="pill active">Overall</button><button class="pill">Disease groups</button><button class="pill">Rare classes</button><button class="pill">Stability</button><span class="grow"></span><span class="note">3 benchmarked models · 59 classes · 5 seeds</span></div>
<div class="ranklist">${[["Overall rank",["1","2","3"]],["Macro-F1",["0.474","0.388","0.260"]],["Seed mean ± std",[".473 ± .006",".382 ± .009",".256 ± .009"]]].map((entry,k)=>`<section class="rankcard"><h3>${entry[0]}</h3>${verified.map((r,i)=>`<div class="rline"><span>${r.name}</span><div class="spark"><i style="left:${72-i*20}%"></i></div><b>${entry[1][i]}</b></div>`).join("")}</section>`).join("")}</div>
<section class="panel" style="margin-top:14px"><div class="panel-head"><h2>Evidence ledger</h2><span class="note">先展示可审计证据，再展开逐类结果</span><span class="grow"></span><button class="pill">Filter evidence</button></div><div class="insight-table"><div class="ih">Model</div><div class="ih">Adapter</div><div class="ih">Checkpoint</div><div class="ih">Preprocess</div><div class="ih">GPU smoke</div><div class="ih">Benchmark</div>${models.slice(0,8).map((m,i)=>`<div class="il">${m}</div><div class="${i<3?'up':''}">${i<3?'Implemented':'Audit pending'}</div><div>${i<3?'SHA verified':'Local asset'}</div><div>${i<3?'Official':'Unverified'}</div><div>${i<3?'Passed':'—'}</div><div>${i<3?'Exploratory':'—'}</div>`).join("")}</div></section></main>`,"c")}
document.getElementById("root").innerHTML=mode==="b"?B():mode==="c"?C():A();
</script></body></html>
