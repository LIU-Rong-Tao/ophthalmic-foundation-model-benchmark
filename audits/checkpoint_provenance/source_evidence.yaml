  vilref:
    repository_class: official
    repository_owner: T6Yang
    official_project_url: https://github.com/T6Yang/ViLReF
    evidence_source_type: author_code_repository_readme
    evidence_summary: ViLReF 论文项目仓库 README 的 checkpoint 表给出 ViLReF_ViT Google Drive 入口。
    license_url: null
    license_status: not_declared
  visionfm:
    repository_class: official
    repository_owner: ABILab-CUHK
    official_project_url: https://github.com/ABILab-CUHK/VisionFM
    evidence_source_type: official_code_repository_readme
    evidence_summary: VisionFM 官方仓库按八种模态逐项给出 Google Drive 权重入口，并声明研究教育用途限制。
    license_url: https://github.com/ABILab-CUHK/VisionFM/blob/main/LICENSE
    license_status: research_and_education_only_noncommercial
  visionunite:
    repository_class: official
    repository_owner: HUANGLIZI
    official_project_url: https://github.com/HUANGLIZI/VisionUnite
    evidence_source_type: paper_code_availability_and_official_code_readme
    evidence_summary: 论文和 README 均确认该官方仓库；README 的 VisionUnite V1 行给出登记权重入口并声明使用限制。
    license_url: https://github.com/HUANGLIZI/VisionUnite/blob/main/LICENSE
