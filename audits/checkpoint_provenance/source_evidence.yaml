    repository_class: official
    repository_owner: justinengelmann
    official_project_url: https://github.com/justinengelmann/RETFound_Green
    evidence_source_type: official_code_repository_readme_and_release
    evidence_summary: 官方仓库 README 给出 v0.1 release 中 retfoundgreen_statedict.pth 的准确下载地址。
    license_url: https://github.com/justinengelmann/RETFound_Green/blob/main/LICENSE
    license_status: repository_license_present_weight_scope_unverified
  retizero:
