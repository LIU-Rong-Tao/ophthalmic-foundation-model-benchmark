    evidence_summary: 论文声明代码位于该作者仓库；仓库 README 给出唯一的模型权重 Google Drive 入口。
    license_url: null
    license_status: not_declared
  keepfit:
    repository_class: official
    repository_owner: lxirich
    official_project_url: https://github.com/lxirich/MM-Retinal
    evidence_source_type: official_code_repository_readme
    evidence_summary: MM-Retinal/KeepFIT 项目 README 的 Checkpoints 表逐项给出三个登记权重入口。
    license_url: null
    license_status: not_declared
  mirage:
    repository_class: official
    repository_owner: j-morano
    official_project_url: https://github.com/j-morano/MIRAGE
    evidence_source_type: official_code_repository_readme
    evidence_summary: MIRAGE 官方仓库 README 明确给出 Base 与 Large 的 Hugging Face 标识及模型权重发布页。
    license_url: https://github.com/j-morano/MIRAGE/blob/main/LICENSE
    license_status: cc-by-4.0_models_and_code_declared
    weight_reference_patterns:
      - j-morano/MIRAGE-Base
      - j-morano/MIRAGE-Large
  preti:
    repository_class: official
    repository_owner: MICV-yonsei
    official_project_url: https://github.com/MICV-yonsei/PRETI
    evidence_source_type: paper_code_availability_and_official_code_readme
    evidence_summary: 论文明确声明代码和预训练模型位于该仓库；README 的 preti-vitb 行给出登记的 Google Drive 入口。
    license_url: null
    license_status: not_declared
  ret-clip:
    repository_class: official
    repository_owner: sStonemason
    official_project_url: https://github.com/sStonemason/RET-CLIP
    evidence_source_type: author_code_repository_readme
    evidence_summary: RET-CLIP 论文项目仓库 README 的 Pretrained Model 表给出 ViT-B/16 权重入口。
    license_url: null
    license_status: not_declared
  retfound:
    repository_class: official
    repository_owner: rmaphoh
    official_project_url: https://github.com/rmaphoh/RETFound
