    evidence_source_type: author_code_repository_readme
    evidence_summary: RetiZero 论文项目仓库 README 直接给出登记的预训练权重 Google Drive 入口。
    license_url: null
    license_status: not_declared
  urfound:
    repository_class: official
    repository_owner: yukkai
    official_project_url: https://github.com/yukkai/UrFound
    evidence_source_type: official_code_repository_readme
    evidence_summary: UrFound README 明确称其为论文官方实现，并在 Release 段链接预训练模型 Hugging Face 仓库。
    license_url: https://github.com/yukkai/UrFound/blob/main/LICENSE
