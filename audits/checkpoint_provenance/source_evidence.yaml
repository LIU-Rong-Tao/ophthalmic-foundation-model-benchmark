schema_version: "1.0"
checkpoints:
  retfound-green-v0.1:
    exact_filename: retfoundgreen_statedict.pth
models:
  deretfound:
    repository_class: official
    repository_owner: Jonlysun
    official_project_url: https://github.com/Jonlysun/DERETFound
    evidence_source_type: official_code_repository_readme
    evidence_summary: 官方仓库 README 明确称其为 RETFound-DE 官方仓库，并将预训练及下游权重指向 Zenodo。
    license_url: https://github.com/Jonlysun/DERETFound/blob/master/LICENSE
    license_status: repository_license_present_weight_scope_unverified
  eyeclip:
    repository_class: official
    repository_owner: Michi-3000
    official_project_url: https://github.com/Michi-3000/EyeCLIP
    evidence_source_type: paper_code_availability_and_official_code_readme
    evidence_summary: 论文 Code availability 指向该仓库；仓库 README 的预训练权重表给出 EyeCLIP Google Drive 入口。
    license_url: null
    license_status: not_declared
  flair:
    repository_class: official
    repository_owner: jusiro
    official_project_url: https://jusiro.github.io/projects/flair
    evidence_source_type: official_project_and_code_readme
    evidence_summary: 作者项目页和代码仓库对应 FLAIR；README 使用 jusiro2/FLAIR 加载正式模型。
    license_url: https://github.com/jusiro/FLAIR/blob/main/LICENSE
    license_status: apache-2.0_code_and_weights_declared
    weight_reference_patterns:
      - jusiro2/FLAIR
  fmue:
    repository_class: official
    repository_owner: yuanyuanpeng0129
    official_project_url: https://github.com/yuanyuanpeng0129/FMUE
