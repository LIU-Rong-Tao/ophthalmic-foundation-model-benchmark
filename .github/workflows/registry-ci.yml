name: Registry CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/sync_registry_package_data.py
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ophbench registry validate
      - run: ophbench catalog build --check
      - run: pytest -q

  wheel-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/ophbench-wheel-test
          /tmp/ophbench-wheel-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/ophbench-wheel-test/bin/python - <<'PY'
          from ophbench import load_registry
          snapshot = load_registry()
          assert snapshot.model_count == 15
          assert snapshot.checkpoint_count == 27
          assert len([c for c in snapshot.checkpoints if c.model_id == "retfound"]) == 2
          assert snapshot.registry_source == "package:ophbench/_registry_data"
          PY
